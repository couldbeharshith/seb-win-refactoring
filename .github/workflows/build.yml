
name: Build Safe Exam Browser 3.10.0

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      - name: Verify WiX Toolset
        shell: pwsh
        run: |
          # WiX 3.14 is pre-installed on windows-2022 runners
          $wixBin = "C:\Program Files (x86)\WiX Toolset v3.14\bin"
          if (-not (Test-Path "$wixBin\heat.exe")) {
            throw "WiX Toolset not found at $wixBin"
          }
          Write-Host "Using WiX Toolset v3.14 at $wixBin"

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          nuget restore SafeExamBrowser.sln

      - name: Build x64 release
        shell: pwsh
        run: |
          # Build all projects except Setup first
          msbuild SafeExamBrowser.sln `
            /m `
            /verbosity:minimal `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /t:"SafeExamBrowser_Runtime;SafeExamBrowser_Client;SebWindowsConfig;SafeExamBrowser_ResetUtility;SafeExamBrowser_Service"

          # Run WiX heat to generate component files (without signing)
          & "C:\Program Files (x86)\WiX Toolset v3.14\bin\heat.exe" dir "SafeExamBrowser.Runtime\bin\x64\Release" -nologo -ag -g1 -scom -srd -sreg -cg ApplicationComponents -dr ApplicationDirectory -sfrag -var var.SafeExamBrowser.Runtime.TargetDir -out Setup\Components\Application.wxs -t Setup\Components\Application.xslt
          & "C:\Program Files (x86)\WiX Toolset v3.14\bin\heat.exe" dir "SebWindowsConfig\bin\x64\Release" -nologo -ag -g1 -scom -srd -sreg -cg ConfigurationComponents -dr ConfigurationDirectory -sfrag -var var.SebWindowsConfig.TargetDir -out Setup\Components\Configuration.wxs -t Setup\Components\Configuration.xslt
          & "C:\Program Files (x86)\WiX Toolset v3.14\bin\heat.exe" dir "SafeExamBrowser.ResetUtility\bin\x64\Release" -nologo -ag -g1 -scom -srd -sreg -cg ResetComponents -dr ResetDirectory -sfrag -var var.SafeExamBrowser.ResetUtility.TargetDir -out Setup\Components\Reset.wxs -t Setup\Components\Reset.xslt
          & "C:\Program Files (x86)\WiX Toolset v3.14\bin\heat.exe" dir "SafeExamBrowser.Service\bin\x64\Release" -nologo -ag -g1 -scom -srd -sreg -cg ServiceComponents -dr ServiceDirectory -sfrag -var var.SafeExamBrowser.Service.TargetDir -out Setup\Components\Service.wxs -t Setup\Components\Service.xslt

          # Now build Setup project
          msbuild Setup\Setup.wixproj `
            /m `
            /verbosity:minimal `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:SignOutput=false `
            /p:PreBuildEvent="" `
            /p:PostBuildEvent=""

          if ($LASTEXITCODE -ne 0) {
            throw "x64 build failed"
          }

          $x64Msi = "Setup\bin\x64\Release\Setup.msi"
          if (-not (Test-Path $x64Msi)) {
            throw "x64 Setup.msi was not generated"
          }

          Copy-Item $x64Msi "$env:RUNNER_TEMP\SEB_Setup_x64.msi"

      - name: Download .NET Framework 4.8 installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\Temp | Out-Null
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/?linkid=2088631" -OutFile "C:\Temp\ndp48-web.exe"

      - name: Build x86 release and setup bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory `
            -Force "Setup\bin\x64\Release" | Out-Null

          Copy-Item "$env:RUNNER_TEMP\SEB_Setup_x64.msi" `
            "Setup\bin\x64\Release\Setup.msi" -Force

          # Build all projects except Setup first
          msbuild SafeExamBrowser.sln `
            /m `
            /verbosity:minimal `
            /p:Configuration=Release `
            /p:Platform=x86 `
            /t:"SafeExamBrowser_Runtime;SafeExamBrowser_Client;SebWindowsConfig;SafeExamBrowser_ResetUtility;SafeExamBrowser_Service"

          # Run WiX heat to generate component files (without signing)
          & "C:\Program Files (x86)\WiX Toolset v3.14\bin\heat.exe" dir "SafeExamBrowser.Runtime\bin\x86\Release" -nologo -ag -g1 -scom -srd -sreg -cg ApplicationComponents -dr ApplicationDirectory -sfrag -var var.SafeExamBrowser.Runtime.TargetDir -out Setup\Components\Application.wxs -t Setup\Components\Application.xslt
          & "C:\Program Files (x86)\WiX Toolset v3.14\bin\heat.exe" dir "SebWindowsConfig\bin\x86\Release" -nologo -ag -g1 -scom -srd -sreg -cg ConfigurationComponents -dr ConfigurationDirectory -sfrag -var var.SebWindowsConfig.TargetDir -out Setup\Components\Configuration.wxs -t Setup\Components\Configuration.xslt
          & "C:\Program Files (x86)\WiX Toolset v3.14\bin\heat.exe" dir "SafeExamBrowser.ResetUtility\bin\x86\Release" -nologo -ag -g1 -scom -srd -sreg -cg ResetComponents -dr ResetDirectory -sfrag -var var.SafeExamBrowser.ResetUtility.TargetDir -out Setup\Components\Reset.wxs -t Setup\Components\Reset.xslt
          & "C:\Program Files (x86)\WiX Toolset v3.14\bin\heat.exe" dir "SafeExamBrowser.Service\bin\x86\Release" -nologo -ag -g1 -scom -srd -sreg -cg ServiceComponents -dr ServiceDirectory -sfrag -var var.SafeExamBrowser.Service.TargetDir -out Setup\Components\Service.wxs -t Setup\Components\Service.xslt

          # Now build Setup and SetupBundle projects
          msbuild SafeExamBrowser.sln `
            /m `
            /verbosity:minimal `
            /p:Configuration=Release `
            /p:Platform=x86 `
            /p:SignOutput=false `
            /p:PreBuildEvent="" `
            /p:PostBuildEvent=""

          if ($LASTEXITCODE -ne 0) {
            throw "x86 build or setup bundle build failed"
          }

          $bundle = "SetupBundle\bin\x86\Release\SetupBundle.exe"
          if (-not (Test-Path $bundle)) {
            throw "SetupBundle.exe was not generated"
          }

      - name: Upload setup bundle
        uses: actions/upload-artifact@v4
        with:
          name: SEB-3.10.0-SetupBundle
          path: SetupBundle/bin/x86/Release/SetupBundle.exe
          if-no-files-found: error
          retention-days: 14
